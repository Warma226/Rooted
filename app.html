<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Rooted · Labo</title>
<link rel="icon" href="assets/logos/rooted-icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Rooted · thème sombre par défaut (voir assets/brand/tokens.json) */
:root{
  --bg:#0b0f14; --surface:#121922; --ink:#e6edf3; --muted:#8b98a8; --line:#1f2a36;
  --accent:#ffb020; --accent-ink:#0b0f14; --accent-soft:#2a210b;
  --open:#3ddc97; --filtered:#ffb020; --closed:#33414f;
  --warn:#ff6b6b; --warn-soft:#3a1a1a; --term:#05080b; --term-ink:#c9d4de;
  --display:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --p1:#ffb020; --p2:#5cc8ff; --p3:#cf8be0; --p4:#3ddc97; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f7f9; --surface:#ffffff; --ink:#0f141a; --muted:#56626f; --line:#dde3e9;
  --accent:#9a5d00; --accent-ink:#ffffff; --accent-soft:#fff1d6;
  --open:#0f7a4f; --filtered:#b7791f; --closed:#c9d2da;
  --warn:#c4302b; --warn-soft:#fde8e7; --term:#0b0f14; --term-ink:#c9d4de;
  --p1:#9a5d00; --p2:#1d6fd1; --p3:#8a3fa5; --p4:#0f7a4f; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#0f141a; --muted:#56626f; --line:#dde3e9;
  --accent:#9a5d00; --accent-ink:#ffffff; --accent-soft:#fff1d6;
  --open:#0f7a4f; --filtered:#b7791f; --closed:#c9d2da;
  --warn:#c4302b; --warn-soft:#fde8e7; --term:#0b0f14; --term-ink:#c9d4de;
  --p1:#9a5d00; --p2:#1d6fd1; --p3:#8a3fa5; --p4:#0f7a4f; color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1.1;color:var(--ink);text-decoration:none;display:block}
.brand .cur{display:inline-block;width:10px;height:19px;background:#ffb020;margin-left:3px;vertical-align:-3px}
@media (prefers-reduced-motion:no-preference){.brand .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* Bloc scan */
.scan{background:var(--term);color:var(--term-ink);border-radius:14px;padding:16px;font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:12px}
.scan .cmd{opacity:.75}
.scan .big{font-size:13px}
.scan .big b{font-size:26px;font-family:var(--display);font-weight:700;color:var(--open);margin-right:4px}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{aspect-ratio:1;max-width:100%;border-radius:5px;border:0;background:var(--closed);color:transparent;font-family:var(--mono);font-size:10px;cursor:pointer;padding:0;display:grid;place-items:center}
.cell.open{background:var(--open);color:var(--accent-ink)}
.cell.filtered{background:var(--filtered);color:#1d1406}
.cell.today{box-shadow:0 0 0 2px var(--term),0 0 0 4px var(--term-ink)}
.cell span{opacity:.9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;opacity:.85}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Carte du jour */
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Liste des phases */
.phase{display:flex;flex-direction:column;gap:6px}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.phase-h h3{font-family:var(--display);font-weight:500;font-size:15px}
.phase-h span{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.days{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;cursor:pointer}
.day:first-child{border-top:0}
.day.ctfrow{grid-template-columns:76px 1fr auto}
.day .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .t{min-width:0;font-weight:500}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.filtered{color:var(--filtered);border-color:var(--filtered)}

/* Feuille du jour */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.blk h4{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.blk p{margin:0}
.blk.val h4{color:var(--filtered)}
.blk.warn{background:var(--warn-soft);border-color:transparent}
.blk.warn h4{color:var(--warn)}
pre{margin:4px 0 0;background:var(--term);color:var(--term-ink);font-family:var(--mono);font-size:12.5px;border-radius:9px;padding:11px 12px;overflow-x:auto;white-space:pre}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:5px}
.copy{align-self:flex-start;font-family:var(--mono);font-size:11px;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--muted)}
.conf{display:flex;gap:6px}
.conf button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;font-family:var(--mono);font-weight:600;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:10px}
.status-sel{display:flex;gap:6px;flex-wrap:wrap}
.status-sel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.status-sel button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qcard h2{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt.good{border-color:var(--open);background:var(--accent-soft)}
.opt.bad{border-color:var(--warn);background:var(--warn-soft)}
.explain{font-size:14px;color:var(--muted)}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Mémo */
.memo-sec{display:flex;flex-direction:column;gap:6px}
.memo-sec h3{font-family:var(--display);font-weight:500;font-size:15px;padding:0 2px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.tr:first-child{border-top:0}
.tr code{background:none;padding:0;word-break:break-word}
.tr span{font-size:13.5px;color:var(--muted)}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px}


/* Labo */
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--term-ink) 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--open);border-radius:99px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.mcard h4{margin:0;font-family:var(--display);font-weight:500;font-size:17px}
.mcard .hint{margin:0}
.pill.diff{color:var(--ink)}
.term{background:var(--term);color:var(--term-ink);border-radius:12px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.45;height:min(52vh,420px);overflow-y:auto;overflow-x:hidden;cursor:text}
#tout div{white-space:pre-wrap;word-break:break-word}
#tout .cmd{color:var(--term-ink);opacity:.95;font-weight:600}
#tout .sys{opacity:.7}
#tout .err{color:var(--warn)}
.tline{display:flex;gap:0;align-items:baseline;flex-wrap:wrap}
.tprompt{color:var(--open);white-space:pre-wrap;word-break:break-all}
#tin{flex:1;min-width:6ch;background:transparent;border:0;outline:0;color:var(--term-ink);font:inherit;font-size:16px;padding:2px 0;caret-color:var(--open)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.flagform{display:flex;gap:8px}
.flagform .search{flex:1;min-width:0;font-family:var(--mono);font-size:14px}
.flagform .btn:disabled{opacity:.7}
.hlist{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details.blk summary{cursor:pointer}
.fakebrowser{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.fb-bar{font-family:var(--mono);font-size:11.5px;background:var(--bg);color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.fb-page{padding:12px 14px;background:var(--surface)}
.fb-page h3{margin:0 0 4px;font-size:18px}
.fb-page p{margin:0 0 6px}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);z-index:30;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px}
.note-legal{font-size:12.5px;color:var(--muted);padding:0 2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <a class="brand" href="index.html">rooted<span class="cur"></span><small>labo · hacking éthique</small></a>
    <div class="sync" id="sync">chargement…</div>
  </header>

  <section id="view-parcours" class="wrap" style="padding:0;gap:18px">
    <div class="scan" aria-label="Progression">
      <div class="cmd">$ nmap --jours 1-30 moi</div>
      <div class="big"><b id="nOpen">0</b>/30 jours terminés · <span id="nFilt">0</span> en cours</div>
      <div class="grid30" id="grid"></div>
      <div class="legend"><span><i style="background:var(--open)"></i>open · terminé</span><span><i style="background:var(--filtered)"></i>filtered · en cours</span><span><i style="background:var(--closed)"></i>closed · à faire</span></div>
    </div>
    <div class="next" id="next"></div>
    <div id="phases" style="display:flex;flex-direction:column;gap:18px"></div>
    <p class="note-legal">Règle n°1 : tu ne testes que tes propres appareils, les plateformes d'entraînement et les cibles explicitement autorisées.</p>
  </section>

  <section id="view-labo" hidden></section>
  <section id="view-quiz" hidden></section>
  <section id="view-memo" hidden></section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-v="parcours" id="tab-parcours">Parcours</button>
  <button class="tab" data-v="labo" id="tab-labo">Labo</button>
  <button class="tab" data-v="quiz" id="tab-quiz">Quiz</button>
  <button class="tab" data-v="memo" id="tab-memo">Mémo</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const PHASES=[
 {n:1,name:"Fondations",days:[1,7],c:"--p1"},
 {n:2,name:"Réseaux",days:[8,14],c:"--p2"},
 {n:3,name:"Méthode et Web",days:[15,22],c:"--p3"},
 {n:4,name:"Systèmes et défense",days:[23,30],c:"--p4"}];

const D=[null,
{t:"Qu'est-ce que le hacking éthique ?",ch:"1",th:"White hat, black hat, grey hat. Les métiers (pentesteur, Red, Blue, Purple Team). La triade CIA : Confidentialité, Intégrité, Disponibilité.",pr:"Crée ton compte sur TryHackMe et sur PortSwigger Web Security Academy. Écris dans ton journal pourquoi tu veux apprendre ça.",va:"Explique en deux phrases la différence entre un pirate et un pentesteur.",an:"Les compétences peuvent être les mêmes. Le pentesteur agit avec une autorisation écrite, dans un périmètre défini, pour aider à corriger."},
{t:"La loi et l'éthique",ch:"2",th:"Accès non autorisé, périmètre (scope), règles d'engagement, divulgation responsable, bug bounty.",pr:"Lis la politique de divulgation (security.txt ou page « Responsible Disclosure ») de deux grandes entreprises : ce qui est autorisé, interdit, comment signaler.",va:"Cite trois situations où tester un système serait illégal, même avec de bonnes intentions.",an:"Tester le Wi-Fi d'un voisin, scanner le site de son école sans accord de la direction, essayer des mots de passe sur le compte de quelqu'un."},
{t:"Installer ton laboratoire de poche",ch:"3",th:"Pourquoi Linux domine la sécurité. Terminal, shell, commande. Gestionnaire de paquets.",pr:"Installe F-Droid puis Termux, et lance :",code:"pkg update && pkg upgrade\npkg install nano curl openssh git python man\ntermux-setup-storage",va:"Tape whoami, pwd et uname -a. Explique ce que chaque commande répond.",an:"whoami : ton nom d'utilisateur. pwd : le dossier où tu es. uname -a : le système et la version du noyau."},
{t:"Se déplacer dans Linux",ch:"4",th:"L'arborescence depuis /, chemins absolus et relatifs, . et .., les fichiers cachés.",pr:"Crée un dossier labo avec trois sous-dossiers et déplace des fichiers de l'un à l'autre.",code:"mkdir -p labo/notes labo/scans labo/rapports\ncd labo\ntouch test.txt\nmv test.txt notes/\nls -la notes",va:"Sans aide : crée labo/notes/jour4.txt, écris une phrase avec nano, affiche-la avec cat.",an:"mkdir -p labo/notes → nano labo/notes/jour4.txt (Ctrl+O, Entrée, Ctrl+X) → cat labo/notes/jour4.txt"},
{t:"Lire, chercher, filtrer",ch:"4",th:"grep, find, le pipe |, les redirections > et >>.",pr:"Connecte-toi à OverTheWire Bandit et termine les niveaux 0 à 3.",code:"ssh bandit0@bandit.labs.overthewire.org -p 2220",va:"Explique ce que fait : cat fichier.txt | grep motdepasse > resultat.txt",an:"Elle lit le fichier, ne garde que les lignes contenant « motdepasse », et les écrit dans resultat.txt (en écrasant son contenu)."},
{t:"Permissions et utilisateurs",ch:"5",th:"Lire rwxr-xr--, propriétaire / groupe / autres, chmod, chown, root et sudo.",pr:"Bandit niveaux 4 à 7. Crée bonjour.sh, rends-le exécutable et lance-le.",code:"nano bonjour.sh\nchmod +x bonjour.sh\n./bonjour.sh",va:"Que signifie chmod 750 script.sh ?",an:"Propriétaire : lire, écrire, exécuter (7). Groupe : lire, exécuter (5). Autres : rien (0)."},
{t:"Bilan de semaine 1",ch:"1 à 5",th:"Relis ton journal de bord et les encadrés « À retenir ».",pr:"Bandit niveaux 8 à 10, ou rattrapage.",va:"Sans notes : la triade CIA avec un exemple par lettre, ce qu'est un périmètre, créer un fichier et changer ses permissions, chercher un mot avec grep.",an:"Si un point bloque, reprends le chapitre concerné avant de continuer. C'est de la consolidation, pas du retard."},
{t:"Les modèles OSI et TCP/IP",ch:"6",th:"Les 7 couches OSI, les 4 couches TCP/IP, l'encapsulation.",pr:"Commence le module réseau de TryHackMe. Dessine les couches avec un protocole pour chacune.",va:"À quelle couche se situe une adresse IP ? Une adresse MAC ? HTTP ?",an:"IP : couche 3 (réseau). MAC : couche 2 (liaison). HTTP : couche 7 (application)."},
{t:"Adresses IP, masques et sous-réseaux",ch:"6",th:"IPv4, IPv6, adresses privées et publiques, CIDR, NAT.",pr:"Note ton adresse locale puis ton adresse publique. Pourquoi sont-elles différentes ?",code:"ip addr\ncurl ifconfig.me",va:"Combien d'adresses utilisables dans 192.168.1.0/24 ?",an:"256 adresses au total, 254 utilisables (on retire l'adresse du réseau et celle de diffusion)."},
{t:"Ports, TCP, UDP et la poignée de main",ch:"7",th:"TCP contre UDP, le three-way handshake SYN / SYN-ACK / ACK, les ports courants.",pr:"Apprends les 15 ports essentiels (onglet Mémo) et fais le quiz Réseaux.",va:"Que tourne-t-il sur les ports 22, 80, 443, 3306, 3389 ?",an:"SSH, HTTP, HTTPS, MySQL, RDP."},
{t:"DNS, HTTP et HTTPS",ch:"7",th:"Résolution DNS, requêtes et réponses HTTP, codes de statut, rôle de TLS.",pr:"Observe une résolution DNS et des en-têtes HTTP.",code:"pkg install dnsutils\nnslookup wikipedia.org\ncurl -I https://wikipedia.org",va:"Que signifient 200, 301, 403, 404 et 500 ?",an:"Succès, redirection permanente, interdit, introuvable, erreur interne du serveur."},
{t:"Premier scan avec Nmap",ch:"8",th:"Ce qu'est un scan, ce qu'il révèle, pourquoi il est encadré légalement.",pr:"Scanne uniquement la cible autorisée par le projet Nmap, ou ta propre box :",code:"pkg install nmap\nnmap -sT scanme.nmap.org\nnmap -sT -sV -p 22,80 scanme.nmap.org",warn:"scanme.nmap.org accepte des scans légers et occasionnels. Ne scanne jamais d'autres adresses publiques.",va:"Différence entre un port open, closed et filtered ?",an:"open : un service accepte. closed : la machine répond qu'aucun service n'écoute. filtered : pas de réponse claire, sans doute un pare-feu."},

/* ---------- État ---------- */
let state={days:{},ctf:{}};      // {"3":{s:"open"|"filtered", conf:1-5, note:""}}
let store=null, docRef=null, writing=false, pendingWrite=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=n=>state.days[n]||{};
const status=n=>ds(n).s||"closed";

function lsGet(){try{return JSON.parse(localStorage.getItem("labo30")||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem("labo30",JSON.stringify(state))}catch(e){}}

async function save(){
  lsSet();
  if(!docRef){return}
  if(writing){pendingWrite=true;return}
  writing=true;
  try{await docRef.set({days:state.days,ctf:state.ctf||{},updatedAt:Date.now()});setSync("Sauvegardé")}
  catch(e){setSync("Sauvegarde locale seulement")}
  writing=false;
  if(pendingWrite){pendingWrite=false;save()}
}
function setSync(t){$("#sync").textContent=t}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1800)}

/* ---------- Parcours ---------- */
function nextDay(){for(let i=1;i<=30;i++){if(status(i)!=="open")return i}return 30}
function renderParcours(){
  const nx=nextDay();
  const g=$("#grid");g.innerHTML="";
  let o=0,f=0;
  for(let i=1;i<=30;i++){
    const s=status(i);if(s==="open")o++;if(s==="filtered")f++;
    const b=document.createElement("button");
    b.className="cell "+(s==="closed"?"":s)+(i===nx?" today":"");
    b.id="cell-"+i;b.setAttribute("aria-label","Jour "+i+" · "+({open:"terminé",filtered:"en cours",closed:"à faire"}[s]));
    b.innerHTML="<span>"+i+"</span>";b.onclick=()=>openDay(i);g.appendChild(b);
  }
  $("#nOpen").textContent=o;$("#nFilt").textContent=f;
  const d=D[nx];
  $("#next").innerHTML=`<div class="eyebrow">${o===30?"Programme terminé":"Prochaine étape · jour "+nx}</div>
    <h2>${o===30?"Bravo, les 30 jours sont faits. Écris ton plan pour les 90 prochains.":esc(d.t)}</h2>
    <div class="row"><button class="btn" id="goNext">Ouvrir le jour ${nx}</button><span class="hint">Cours, chapitre ${esc(d.ch)}</span></div>`;
  $("#goNext").onclick=()=>openDay(nx);
  const ph=$("#phases");ph.innerHTML="";
  PHASES.forEach(p=>{
    let done=0;for(let i=p.days[0];i<=p.days[1];i++)if(status(i)==="open")done++;
    const tot=p.days[1]-p.days[0]+1;
    const sec=document.createElement("div");sec.className="phase";
    sec.innerHTML=`<div class="phase-h"><h3><span style="color:var(${p.c})">Phase ${p.n}</span> · ${p.name}</h3><span>${done}/${tot}</span></div><div class="days"></div>`;
    const list=sec.querySelector(".days");
    for(let i=p.days[0];i<=p.days[1];i++){
      const s=status(i),c=ds(i).conf;
      const b=document.createElement("button");b.className="day";b.id="day-"+i;
      b.innerHTML=`<span class="n">J${String(i).padStart(2,"0")}</span><span class="t">${esc(D[i].t)}</span><span class="pill ${s}">${s==="open"?"open"+(c?" · "+c+"/5":""):s==="filtered"?"filtered":"closed"}</span>`;
      b.onclick=()=>openDay(i);list.appendChild(b);
    }
    ph.appendChild(sec);
  });
}

/* ---------- Fiche du jour ---------- */
let noteT,curDay=0;
function openDay(n){
  curDay=n;const d=D[n],st=ds(n);
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet-in">
    <div class="sheet-bar"><button class="btn ghost" id="close">← Parcours</button>
      <div class="row"><button class="btn ghost" id="prev" ${n===1?"disabled":""} aria-label="Jour précédent">‹</button><button class="btn ghost" id="nextd" ${n===30?"disabled":""} aria-label="Jour suivant">›</button></div></div>
    <div class="eyebrow">Jour ${n} · cours, chapitre ${esc(d.ch)}</div>
    <h2 id="sheetTitle">${esc(d.t)}</h2>
    <div class="blk"><h4>Théorie · 20–30 min</h4><p>${esc(d.th)}</p></div>
    <div class="blk"><h4>Pratique · 30–45 min</h4><p>${esc(d.pr)}</p>${d.code?`<pre id="code">${esc(d.code)}</pre><button class="copy" id="copy">Copier les commandes</button>`:""}</div>
    ${d.warn?`<div class="blk warn"><h4>Attention</h4><p>${esc(d.warn)}</p></div>`:""}
    <div class="blk val"><h4>Validation · sans tes notes</h4><p>${esc(d.va)}</p>
      <button class="copy" id="reveal" aria-expanded="false">Voir une réponse possible</button><p id="ans" class="hint" hidden>${esc(d.an)}</p></div>
    <div class="blk"><h4>Statut</h4><div class="status-sel" role="group" aria-label="Statut du jour">
      <button data-s="closed" id="st-closed">À faire</button><button data-s="filtered" id="st-filtered">En cours</button><button data-s="open" id="st-open">Terminé</button></div></div>
    <div class="blk"><h4>Confiance</h4><p class="hint">1 = perdu · 5 = je pourrais l'expliquer à quelqu'un</p>
      <div class="conf" role="group" aria-label="Confiance">${[1,2,3,4,5].map(k=>`<button data-c="${k}" id="conf-${k}">${k}</button>`).join("")}</div></div>
    <div class="blk"><h4>Journal de bord</h4><p class="hint">3 choses apprises + 1 question restée ouverte</p>
      <textarea id="note-${n}" placeholder="1. …&#10;2. …&#10;3. …&#10;Question : …">${esc(st.note||"")}</textarea></div>
  </div>`;
  sh.hidden=false;sh.scrollTop=0;document.body.style.overflow="hidden";
  const sync=()=>{
    const s=status(n);sh.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s));
    sh.querySelectorAll("[data-c]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.c===ds(n).conf));
  };sync();
  const upd=p=>{state.days[n]={...ds(n),...p};save();sync();renderParcours()};
  sh.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{upd({s:b.dataset.s});if(b.dataset.s==="open")toast("Jour "+n+" terminé")});
  sh.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>upd({conf:+b.dataset.c}));
  const ta=sh.querySelector("textarea");
  ta.oninput=()=>{clearTimeout(noteT);noteT=setTimeout(()=>{state.days[n]={...ds(n),note:ta.value};if(status(n)==="closed"&&ta.value.trim())state.days[n].s="filtered";save();sync();renderParcours()},700)};
  $("#close").onclick=closeDay;
  $("#prev").onclick=()=>n>1&&openDay(n-1);
  $("#nextd").onclick=()=>n<30&&openDay(n+1);
  $("#reveal").onclick=e=>{const a=$("#ans");a.hidden=!a.hidden;e.target.setAttribute("aria-expanded",!a.hidden);e.target.textContent=a.hidden?"Voir une réponse possible":"Masquer la réponse"};
  const cp=$("#copy");if(cp)cp.onclick=()=>{const t=d.code;
    try{navigator.clipboard.writeText(t).then(()=>toast("Commandes copiées"),()=>selectCode())}catch(e){selectCode()}};
  try{history.replaceState(null,"","#jour-"+n)}catch(e){}
}
function selectCode(){const r=document.createRange();r.selectNodeContents($("#code"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Sélectionné : copie-le")}
function closeDay(){const ta=$("#sheet textarea[id^='note-']");if(ta&&curDay){clearTimeout(noteT);if((ds(curDay).note||"")!==ta.value){state.days[curDay]={...ds(curDay),note:ta.value};save();renderParcours()}}
  $("#sheet").hidden=true;document.body.style.overflow="";try{history.replaceState(null,"","#parcours")}catch(e){}}

/* ---------- Quiz ---------- */
let qi=0,qScore=0,qAnswered=false,qOrder=[];
function startQuiz(){qOrder=QUIZ.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);qi=0;qScore=0;renderQuiz()}
function renderQuiz(){
  const v=$("#view-quiz");
  if(qi>=qOrder.length){
    v.innerHTML=`<div class="qcard"><div class="eyebrow">Résultat</div><h2>${qScore}/10</h2>
      <p class="explain">${qScore>=8?"Solide. Tu peux passer à la suite.":qScore>=5?"Bonne base. Relis les chapitres des questions ratées.":"Pas d'inquiétude : reprends les bilans de semaine et réessaie demain."}</p>
      <button class="btn" id="again">Nouvelle série</button></div>`;
    $("#again").onclick=startQuiz;return}
  const Q=QUIZ[qOrder[qi]];qAnswered=false;
  v.innerHTML=`<div class="qcard"><div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${qi+1}/10</span><span class="score">score ${qScore}</span></div>
    <h2>${esc(Q.q)}</h2><div class="opts">${Q.o.map((o,i)=>`<button class="opt" data-i="${i}" id="opt-${i}">${esc(o)}</button>`).join("")}</div>
    <p class="explain" id="exp" hidden></p><button class="btn" id="qnext" hidden>Question suivante</button></div>`;
  v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(qAnswered)return;qAnswered=true;const i=+b.dataset.i;
    if(i===Q.a)qScore++;
    v.querySelectorAll(".opt").forEach(x=>{const k=+x.dataset.i;if(k===Q.a)x.classList.add("good");else if(k===i)x.classList.add("bad")});
    const e=$("#exp");e.textContent=(i===Q.a?"Exact. ":"Pas tout à fait. ")+Q.e;e.hidden=false;$("#qnext").hidden=false;});
  $("#qnext").onclick=()=>{qi++;renderQuiz()};
}

/* ---------- Mémo ---------- */
function renderMemo(){
  const v=$("#view-memo");
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px"><input class="search" id="memo-q" type="search" placeholder="Chercher une commande ou un port…" aria-label="Chercher"><div id="memo-list" style="display:flex;flex-direction:column;gap:16px"></div></div>`;
  const draw=q=>{q=q.toLowerCase();$("#memo-list").innerHTML=MEMO.map(s=>{
    const rows=s.r.filter(r=>!q||(r[0]+" "+r[1]).toLowerCase().includes(q));
    return rows.length?`<div class="memo-sec"><h3>${s.h}</h3><div class="tbl">${rows.map(r=>`<div class="tr"><code>${esc(r[0])}</code><span>${esc(r[1])}</span></div>`).join("")}</div></div>`:""}).join("")||`<p class="hint">Rien trouvé pour « ${esc(q)} ».</p>`};
  draw("");$("#memo-q").oninput=e=>draw(e.target.value);
}

/* ---------- Navigation ---------- */
function show(v){
  ["parcours","labo","quiz","memo"].forEach(k=>{$("#view-"+k).hidden=k!==v;$("#tab-"+k).setAttribute("aria-current",k===v?"page":"false")});
  if(v==="quiz"&&!qOrder.length)startQuiz();
  if(v==="memo"&&!$("#memo-q"))renderMemo();
  if(v==="labo")renderLabo();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{closeDay();show(b.dataset.v);try{history.replaceState(null,"","#"+b.dataset.v)}catch(e){}});
function route(){const h=location.hash.slice(1);const m=h.match(/^jour-(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=30){show("parcours");openDay(+m[1]);return}
  show(["labo","quiz","memo"].includes(h)?h:"parcours")}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeDay()});

/* ---------- Démarrage ---------- */
const local=lsGet();if(local&&local.days)state={days:local.days,ctf:local.ctf||{}};
renderParcours();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',route);else setTimeout(route,0);

setSync(local?"Progression enregistrée sur cet appareil":"Ta progression sera enregistrée sur cet appareil");

/* ---------- Points ---------- */
function solved(k){return !!(state.ctf&&state.ctf[k])}
function points(){let p=0;MACHINES.forEach(m=>{if(solved(m.id+"u"))p+=20;if(solved(m.id+"r"))p+=30});CTF.forEach(c=>{if(solved(c.id))p+=c.pts});return p}
const MAXPTS=MACHINES.length*50+CTF.reduce((a,c)=>a+c.pts,0);
function rank(p){return p>=300?"Hacker éthique":p>=180?"Explorateur":p>=80?"Apprenti":"Débutant"}
function markSolved(k,label){state.ctf=state.ctf||{};if(state.ctf[k])return false;state.ctf[k]=Date.now();save();toast(label);return true}
const norm=s=>s.trim().toLowerCase().replace(/^flag\{|\}$/g,"");
const sameFlag=(a,b)=>norm(a)===norm(b)&&a.trim()!=="";

/* ---------- Vue Labo ---------- */
function renderLabo(){
  const v=$("#view-labo"),p=points();
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:18px">
   <div class="scan"><div class="cmd">$ cat score.txt</div>
     <div class="big"><b>${p}</b>/${MAXPTS} points · rang : ${rank(p)}</div>
     <div class="bar"><i style="width:${Math.round(p/MAXPTS*100)}%"></i></div></div>
   <p class="note-legal">Tout ce labo est <b>simulé dans ton navigateur</b> : aucune vraie machine n'est attaquée. Les adresses 10.10.0.x n'existent que dans cette page.</p>
   <div class="phase"><div class="phase-h"><h3>Machines</h3><span>${MACHINES.filter(m=>solved(m.id+"r")).length}/${MACHINES.length} rootées</span></div>
     <div class="mgrid">${MACHINES.map(m=>`<button class="mcard" id="mach-${m.id}">
       <div class="row" style="justify-content:space-between"><span class="eyebrow">${m.os} · ${m.ip}</span><span class="pill diff">${m.diff}</span></div>
       <h4>${m.name}</h4><p class="hint">${m.tags.join(" · ")}</p>
       <div class="row"><span class="pill ${solved(m.id+"u")?"open":""}">user ${solved(m.id+"u")?"✓":"20 pts"}</span><span class="pill ${solved(m.id+"r")?"open":""}">root ${solved(m.id+"r")?"✓":"30 pts"}</span></div></button>`).join("")}</div></div>
   <div class="phase"><div class="phase-h"><h3>Défis CTF</h3><span>${CTF.filter(c=>solved(c.id)).length}/${CTF.length} résolus</span></div>
     <div class="days">${CTF.map(c=>`<button class="day ctfrow" id="ctf-${c.id}"><span class="n">${c.cat}</span><span class="t">${esc(c.t)}</span><span class="pill ${solved(c.id)?"open":""}">${solved(c.id)?"✓ "+c.pts:c.pts+" pts"}</span></button>`).join("")}</div></div>
   <p class="note-legal">Prêt pour de vraies machines ? Elles t'attendent, en toute légalité, sur TryHackMe, Hack The Box, Root Me et picoCTF.</p></div>`;
  MACHINES.forEach(m=>$("#mach-"+m.id).onclick=()=>openMachine(m));
  CTF.forEach(c=>$("#ctf-"+c.id).onclick=()=>openCtf(c));
}

/* ---------- Fiche défi ---------- */
function openCtf(c){
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet-in">
   <div class="sheet-bar"><button class="btn ghost" id="close">← Labo</button><span class="pill ${solved(c.id)?"open":""}">${solved(c.id)?"résolu":c.pts+" pts"}</span></div>
   <div class="eyebrow">Défi · ${c.cat}</div><h2 id="sheetTitle">${esc(c.t)}</h2>
   <div class="blk"><h4>Énoncé</h4><p>${esc(c.q)}</p>${c.data?`<pre>${esc(c.data)}</pre>`:""}
    ${c.web?`<div class="fakebrowser"><div class="fb-bar">http://horizon.exemple/</div><div class="fb-page"><h3>Agence Horizon</h3><p>Vos voyages, notre passion.</p><u>Nous contacter</u></div></div>
      <button class="copy" id="src" aria-expanded="false">Afficher le code source</button><pre id="srccode" hidden>${esc(c.web)}</pre>`:""}</div>
   <div class="blk"><h4>Indice</h4><button class="copy" id="tipb" aria-expanded="false">Révéler l'indice</button><p class="hint" id="tip" hidden>${esc(c.tip)}</p></div>
   <div class="blk"><h4>Ton drapeau</h4><form class="flagform" id="cf"><input id="flag-${c.id}" class="search" placeholder="flag{…}" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="btn">Valider</button></form><p class="hint" id="fres" role="status"></p></div>
   <p class="hint">Astuce : le terminal de n'importe quelle machine (onglet Labo → une machine) sait faire base64 -d, rot13, xxd -r -p et hashcheck.</p></div>`;
  openSheetCommon();
  $("#close").onclick=()=>{closeSheet();renderLabo()};
  if(c.web)$("#src").onclick=e=>{const s=$("#srccode");s.hidden=!s.hidden;e.target.setAttribute("aria-expanded",!s.hidden);e.target.textContent=s.hidden?"Afficher le code source":"Masquer le code source"};
  $("#tipb").onclick=e=>{const t=$("#tip");t.hidden=!t.hidden;e.target.setAttribute("aria-expanded",!t.hidden)};
  $("#cf").onsubmit=e=>{e.preventDefault();const val=$("#flag-"+c.id).value;
    if(sameFlag(val,c.f)){markSolved(c.id,"+"+c.pts+" points");$("#fres").textContent="Drapeau correct. Bien joué !";$("#fres").style.color="var(--open)"}
    else{$("#fres").textContent="Ce n'est pas le bon drapeau. Vérifie l'orthographe exacte.";$("#fres").style.color="var(--warn)"}};
}

function tokenize(line){const t=[];let cur="",q=null,has=false;
  for(const ch of line){if(q){if(ch===q)q=null;else cur+=ch}else if(ch==='"'||ch==="'"){q=ch;has=true}else if(/\s/.test(ch)){if(cur||has){t.push(cur);cur="";has=false}}else cur+=ch}
  if(cur||has)t.push(cur);return t}

async function runPipeline(s,line){
  const parts=splitPipes(line);let input=null,out="";
  for(let i=0;i<parts.length;i++){const r=await runCmd(s,tokenize(parts[i].trim()),input,parts[i].trim());if(r===undefined)return;out=r;input=r}
  return out}

async function runCmd(s,a,stdin,raw){

  case"ls":{const long=a.some(x=>/^-[a-z]*l/.test(x)),all=a.some(x=>/^-[a-z]*a/.test(x));const target=a.filter(x=>!x.startsWith("-"))[1];const path=resolve(s,target||s.cwd);
    if(!remote){const kids=Object.keys(s.lfs).filter(k=>k.startsWith(path+"/")).map(k=>k.slice(path.length+1).split("/")[0]);

    const url=a.filter(x=>!x.startsWith("-"))[1];if(!url)return"usage : curl [-d \"user=…&pass=…\"] http://ip/chemin";
    const mm=url.match(/^(?:https?:\/\/)?([\d.]+)(\/[^\s]*)?$/);if(!mm)return"curl: (6) Could not resolve host";
    if(mm[1]!==m.ip)return"curl: (7) Hors périmètre : seule "+m.ip+" est autorisée dans cette mission.";

function webRoute(s,path,data){const m=s.m;
  if(m.web){const p=path.split("?")[0];return m.web[p]??"404 Not Found"}
  if(m.id!=="m3")return"404 Not Found";
  const [p,qs]=path.split("?");const q=new URLSearchParams(qs||"");
  if(p==="/")return`<!doctype html>
<html><head><title>FacturePro — Espace clients</title></head>
<body>
  <h1>FacturePro</h1>
  <p>Consultez vos factures en ligne.</p>
  <form method="POST" action="/login">user / pass</form>
  <p>Compte de démonstration : demo / demo</p>
</body></html>`;
  if(p==="/robots.txt")return"User-agent: *\nDisallow: /admin";
  if(p==="/admin")return"302 Found → /login (connexion administrateur requise)";
  if(p==="/login"){if(data===null)return"405 Method Not Allowed — envoie les identifiants en POST : curl -d \"user=…&pass=…\" http://"+m.ip+"/login";
    const f=new URLSearchParams(data);const u=f.get("user")??"",pw=f.get("pass")??"";
    const query="SELECT * FROM users WHERE user='"+u+"' AND pass='"+pw+"'";
    const ok=sqlEval(u,pw);
    if(ok==="error")return"500 Internal Server Error\nErreur SQL : syntax error near \"'\"\nRequête : "+query+"\n\n(Une application sûre n'afficherait jamais ce message… et utiliserait une requête préparée.)";
    if(ok==="admin")return"200 OK\nBienvenue admin.\nPanneau d'administration — clé de déploiement : "+m.flags.root+"\n\nRequête exécutée : "+query;
    if(ok==="demo")return"200 OK\nBienvenue demo.\nVos factures : /facture?id=1042";
    if(ok)return"200 OK\nBienvenue "+ok+".";
    return"401 Unauthorized\nIdentifiants incorrects."}
  if(p==="/facture"){const id=q.get("id");const F={"1042":"Facture n°1042 — client : demo — Abonnement fibre — 25 000 FCFA","1001":"Facture n°1001 — client : admin — Licence serveur annuelle\nRéférence interne : "+m.flags.user,"1043":"Facture n°1043 — client : k.ouedraogo — Installation — 40 000 FCFA"};
    if(!id)return"400 Bad Request — paramètre id manquant";return F[id]?"200 OK\n"+F[id]+(id!=="1042"?"\n\n(Tu vois la facture d'un autre client : c'est une IDOR. Le serveur ne vérifie pas à qui elle appartient.)":""):"404 Facture introuvable"}
  return"404 Not Found"}
/* Mini moteur SQL simulé : assez fidèle pour montrer pourquoi coller une saisie dans une requête est dangereux */
const USERS_TABLE=[{user:"admin",pass:"Xk9#vQ2!mZ"},{user:"demo",pass:"demo"},{user:"k.ouedraogo",pass:"Baobab!77"}];
function sqlEval(u,pw){
  const where="user='"+u+"' AND pass='"+pw+"'";
  let clause="",inStr=false;
  for(let i=0;i<where.length;i++){const ch=where[i];
    if(ch==="'"){inStr=!inStr;clause+=ch;continue}
    if(!inStr&&(ch==="#"||(ch==="-"&&where[i+1]==="-")))break;
    clause+=ch}
  if(inStr)return"error";
  const toks=[];const re=/\s*(?:'([^']*)'|(\d+)|(=)|(\()|(\))|([A-Za-z_]+))/y;let m,pos=0;const c=clause.trim();
  re.lastIndex=0;
  while(pos<c.length){re.lastIndex=pos;m=re.exec(c);if(!m||m.index!==pos)return"error";pos=re.lastIndex;
    if(m[1]!==undefined)toks.push({v:m[1]});else if(m[2])toks.push({v:m[2]});else if(m[3])toks.push({op:"="});else if(m[4]||m[5]){}else{const w=m[6].toLowerCase();
      if(w==="and"||w==="or")toks.push({op:w});else if(w==="true")toks.push({v:"1"});else if(w==="user"||w==="pass")toks.push({id:w});else return"error"}
    while(pos<c.length&&/\s/.test(c[pos]))pos++}
  // expr = term (or term)* ; term = cmp (and cmp)* ; cmp = val [= val]
  let i=0;const val=row=>{const t=toks[i++];if(!t||t.op)throw 0;return t.id?row[t.id]:t.v};
  const cmp=row=>{const a=val(row);if(toks[i]&&toks[i].op==="="){i++;return a===val(row)}return a!==""&&a!=="0"};
  const term=row=>{let r=cmp(row);while(toks[i]&&toks[i].op==="and"){i++;r=cmp(row)&&r}return r};
  const expr=row=>{let r=term(row);while(toks[i]&&toks[i].op==="or"){i++;r=term(row)||r}return r};
  try{for(const row of USERS_TABLE){i=0;const r=expr(row);if(i!==toks.length)return"error";if(r)return row.user}}catch(e){return"error"}
  return null}

/* ---------- Fiche machine ---------- */
function openMachine(m){
  const s=sessions[m.id]||(sessions[m.id]=newSession(m));
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet-in">
   <div class="sheet-bar"><button class="btn ghost" id="close">← Labo</button><span class="pill diff">${m.diff} · ${m.ip}</span></div>
   <div class="eyebrow">Machine · ${m.os}</div><h2 id="sheetTitle">${m.name}</h2>
   <details class="blk"><summary><b>Mission</b> — ordre de mission et autorisation</summary><p style="margin-top:8px">${esc(m.brief)}</p></details>
   <div class="term" id="term"><div id="tout"></div>
     <form id="tform" class="tline"><label for="tin" class="tprompt" id="tprompt"></label><input id="tin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></form></div>
   <div class="chips" id="chips">${m.chips.map((c,i)=>`<button class="chip" data-i="${i}">${esc(c.trim()||c)}</button>`).join("")}<button class="chip" data-k="up">↑ précédente</button></div>
   <div class="blk"><h4>Drapeaux</h4>
     ${["user","root"].map(k=>`<form class="flagform" data-k="${k}"><input id="mf-${m.id}-${k}" class="search" placeholder="${k}.txt : flag{…}" autocapitalize="off" autocomplete="off" spellcheck="false" ${solved(m.id+k[0])?'value="'+m.flags[k]+'" disabled':""}><button class="btn" ${solved(m.id+k[0])?"disabled":""}>${solved(m.id+k[0])?"✓":"Valider"}</button></form>`).join("")}
     <p class="hint" id="mres" role="status"></p></div>
   <div class="blk"><h4>Indices</h4><p class="hint">Essaie d'abord seul. Chaque indice révèle un peu plus.</p><button class="copy" id="hintb">Indice suivant (0/${m.hints.length})</button><ol id="hlist" class="hlist"></ol></div>
   <div class="blk" id="lesson" ${solved(m.id+"r")?"":"hidden"}><h4>Débrief · ce qu'il fallait corriger</h4><p>${esc(m.lesson)}</p></div></div>`;
  openSheetCommon();
  $("#close").onclick=()=>{closeSheet();renderLabo()};
  const tin=$("#tin");
  const draw=()=>{const o=$("#tout");o.innerHTML=s.out.map(x=>`<div class="${x.c||""}">${esc(x.t)}</div>`).join("");
    $("#tprompt").textContent=s.mode==="ssh-pass"||s.mode==="su-pass"?"":s.mode==="ftp-user"?"Name ("+m.ip+":toi): ":s.mode==="ftp-pass"?"Password: ":prompt(s);
    tin.type=(s.mode==="ssh-pass"||s.mode==="su-pass"||s.mode==="ftp-pass")?"password":"text";const t=$("#term");t.scrollTop=t.scrollHeight};
  draw();
  let hn=s.hintsShown||0;const showHints=()=>{$("#hlist").innerHTML=m.hints.slice(0,hn).map(h=>`<li>${esc(h)}</li>`).join("");$("#hintb").textContent=hn>=m.hints.length?"Tous les indices sont affichés":`Indice suivant (${hn}/${m.hints.length})`};showHints();
  $("#hintb").onclick=()=>{if(hn<m.hints.length){hn++;s.hintsShown=hn;showHints()}};
  $("#tform").onsubmit=async e=>{e.preventDefault();const line=tin.value;tin.value="";
    if(s.mode==="ssh-pass"||s.mode==="su-pass"){const u=s.pending.user,ok=m.users&&m.users[u]===line;
      if(s.mode==="ssh-pass"){s.out.push({t:"********"});if(ok){s.stack.push({host:s.host,user:s.user,cwd:s.cwd});s.host=m.ip;s.user=u;s.cwd=u==="root"?"/root":"/home/"+u;s.out.push({t:"Welcome to Ubuntu 22.04 LTS\nLast login: Thu Oct 30 21:04:11 2026",c:"sys"})}else s.out.push({t:"Permission denied, please try again.",c:"err"})}
      else{if(ok){s.stack.push({host:s.host,user:s.user,cwd:s.cwd});s.user=u;s.cwd=u==="root"?"/root":"/home/"+u;s.out.push({t:"(connecté en tant que "+u+")",c:"sys"})}else s.out.push({t:"su : Échec de l'authentification",c:"err"})}
      s.mode=null;draw();return}
    if(s.mode==="ftp-user"){s.out.push({t:"Name: "+line});if(line.trim().toLowerCase()==="anonymous"){s.mode="ftp-pass"}else{s.out.push({t:"530 Login incorrect.",c:"err"});s.mode=null}draw();return}
    if(s.mode==="ftp-pass"){s.out.push({t:"Password:\n230 Login successful.\nRemote system type is UNIX.\nCommandes : ls, get <fichier>, exit",c:"sys"});s.mode="ftp";draw();return}
    s.out.push({t:prompt(s)+line,c:"cmd"});if(line.trim()){s.hist.push(line);s.hi=s.hist.length}
    let res;
    if(s.mode==="ftp"){const a=tokenize(line);if(a[0]==="ls"||a[0]==="dir")res="-rw-r--r--  1 ftp ftp  "+Object.keys(m.ftp).map(k=>k).join("\n-rw-r--r--  1 ftp ftp  ");else if(a[0]==="get"||a[0]==="exit"||a[0]==="bye"||a[0]==="quit")res=await runCmd(s,a[0]==="bye"||a[0]==="quit"?["exit"]:a,null);else res="?Commande invalide (ls, get, exit)"}
    else res=await runPipeline(s,line);
    if(res)s.out.push({t:res,c:!/^(Starting Nmap|200 OK)/.test(res)&&/^[\w\/.-]+: |commande introuvable|Permission denied|Échec|^\d{3} (?!OK)/.test(res)?"err":""});
    if(s.out.length>300)s.out=s.out.slice(-300);draw();
    // détection automatique des drapeaux affichés
    ["user","root"].forEach(k=>{if(res&&res.includes(m.flags[k])&&!solved(m.id+k[0]))$("#mres").textContent="Un drapeau vient de s'afficher : copie-le dans le champ "+k+"."});
  };
  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;
    if(b.dataset.k==="up"){if(s.hist.length){s.hi=Math.max(0,s.hi-1);tin.value=s.hist[s.hi]}}else tin.value=m.chips[+b.dataset.i];tin.focus();try{tin.setSelectionRange(tin.value.length,tin.value.length)}catch(_){} };
  tin.addEventListener("keydown",e=>{if(e.key==="ArrowUp"){e.preventDefault();if(s.hist.length){s.hi=Math.max(0,s.hi-1);tin.value=s.hist[s.hi]}}
    if(e.key==="ArrowDown"){e.preventDefault();s.hi=Math.min(s.hist.length,s.hi+1);tin.value=s.hist[s.hi]||""}});
  $("#term").onclick=e=>{if(!getSelection().toString())tin.focus()};
  sh.querySelectorAll(".flagform[data-k]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const k=f.dataset.k,inp=f.querySelector("input");
    if(sameFlag(inp.value,m.flags[k])){markSolved(m.id+k[0],k==="user"?"Accès utilisateur : +20 points":"Machine rootée : +30 points");inp.disabled=true;f.querySelector("button").disabled=true;f.querySelector("button").textContent="✓";$("#mres").textContent=k==="root"?"Machine terminée. Lis le débrief ci-dessous.":"Drapeau user validé. Maintenant, deviens root.";if(k==="root")$("#lesson").hidden=false}
    else $("#mres").textContent="Ce n'est pas le bon drapeau pour "+k+".txt."});
}
